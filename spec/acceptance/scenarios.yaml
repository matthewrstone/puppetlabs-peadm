- id: U-04
  name: Upgrade then eyaml decryption fails (empty-DN PKCS7 certificate)
  category: upgrade
  from: 2025.11.0
  to: 2025.11.2
  arch: standard
  fault: eyaml key pair created with `eyaml createkeys --pkcs7-subject '/'`
  repro:
    - create eyaml keys with an empty subject, add an ENC[PKCS7,...] value to
      Hiera data, confirm a catalog compiles on 2025.11.0
    - upgrade to 2025.11.2 and compile a catalog that looks the value up
  expect:
    - (planned) preflight known-issue rule flags the key and the target version
    - post-flight catalog compile fails the run instead of reporting success
  notes: GJira-7 (vendored hiera-eyaml 5.0.1) closed this in PE itself; keep the
    scenario as the template for known-issue rules.
  cases: [CASE-012, GJira-7]
  status: new
  priority: 2

