  arch_assumed: standard
  fault: target version is older than the installed version
  repro:
    - on an installed 2025.11.3 cluster run peadm::upgrade version=2025.10.0
  expect:
    - fails before any service is stopped; message points to restore-from-backup
    - the installer's own rule is chronological (release date), not only the
      version number, so a lower number can also be refused
  cases: [CASE-009]
  status: unit
  priority: 1

