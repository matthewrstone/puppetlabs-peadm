# Scenario catalog for on-demand install / upgrade / downgrade / rollback /
# failover testing. Source of truth for documentation/test-scenarios.md and
# for the CI matrix emitted by spec/acceptance/scenarios.rb.
#
# Fields
#   id           Stable identifier. Prefix: I install, U upgrade, D downgrade,
#                R rollback, F failover/role swap, M migrate, B backup/restore,
#                C compiler/convert, P replica, DB database.
#   from / to    PE version under test (`to` only for transitions). These are
#                the versions in the customer report when known. When a report
#                gives only a release line (e.g. 2025.10) the patch is "x".
#   ci_from/ci_to  Installable versions CI can use to exercise the same path
#                when the customer's exact version is not worth testing.
#   arch         peadm architecture: standard, standard-with-dr, large,
#                large-with-dr, extra-large, extra-large-with-dr. "unknown"
#                means the report does not say; `arch_assumed` is used to run it.
#   ci_arch      Architecture the existing CI workflow uses when it differs from `arch`.
#   os           OS of the nodes under test, when it matters to the scenario.
#   fault        Condition to inject, if the scenario is not a happy path.
#   repro        Steps to reproduce on a fresh test cluster.
#   expect       What a correct peadm does. Entries tagged (planned) depend on
#                work in the improvement plan that does not exist yet.
#   cases        Feedback items the scenario comes from (peadm.csv).
#   status       ci           runs on pull requests today
#                ci-partial   a PR workflow runs the same path but does not inject the fault
#                ci-manual    workflow exists but is workflow_dispatch only (version and
#                             image are inputs, so it can run on demand)
#                manual       acceptance plan exists and is run by hand on operator VMs;
#                             no workflow
#                unit         covered by rspec only
#                new          needs an acceptance plan written
#                repro-only   needs an environment or fault we cannot script yet
#   workflow     Existing workflow that covers it, if any.
#   priority     1 (ship-blocking) .. 3 (nice to have)
---
- id: I-01
  name: Fresh install, supported architectures
  category: install
  from: 2025.12.1
  arch: [standard-with-dr, large, extra-large-with-dr]
  os: almalinux-8
  repro:
    - provision_test_cluster, then install_test_cluster for each architecture
    - repeat for 2023.8.13, 2025.12.1 and 2026.0.1 (also RHEL 9 and RHEL 8 FIPS)
  expect:
    - install completes and peadm::status reports operational
  cases: [control]
  status: ci
  workflow: test-install-matrix.yaml
  priority: 1

- id: I-02
