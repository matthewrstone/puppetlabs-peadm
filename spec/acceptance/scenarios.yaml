- id: U-01
  name: Skip-line upgrade 2023.8 to 2025.12 (pe-puppetdb reload flake)
  category: upgrade
  from: 2023.8.8
  to: 2025.12.0
  ci_from: 2023.8.13
  ci_to: 2025.12.1
  arch: unknown
  arch_assumed: standard
  fault: first reload of pe-puppetdb fails during `puppet infrastructure configure`
  repro:
    - install 2023.8.x, then peadm::upgrade to 2025.12.x
    - to inject the fault, add a systemd drop-in on the primary that makes
      pe-puppetdb ExecReload fail once (for example a script that exits 1 the
      first time and 0 afterwards)
    - the report shows installer exit code 6 on the first attempt and a
      successful reload on later attempts
  expect:
    - failure message includes the installer log tail and the failed unit status
    - (planned) one automatic retry of the configure run, then resume
  cases: [CASE-002, GJira-1]
  status: ci-partial
  workflow: test-upgrade-matrix.yaml
  priority: 1

- id: U-02
