  fault: Code Manager remote is git over SSH and its host key is not in known_hosts
  repro:
    - configure Code Manager with an SSH r10k remote and no r10k_known_hosts
    - upgrade; then `puppet code deploy production --wait`
  expect:
    - preflight warns before the upgrade; post-flight deploy check fails loudly
      with "invalid or unknown remote ssh hostkey"
  cases: [CASE-008]
  status: new
  priority: 2

